name: Flask CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Go to project directory
            cd /home/ubuntu/flask-cicd || exit

            # Pull latest code
            git pull origin main

            # Install dependencies
            sudo apt update
            sudo apt install python3-pip python3-venv -y

            # Create venv if not exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Activate venv
            source venv/bin/activate

            # Install Python packages
            pip install --upgrade pip
            pip install -r requirements.txt

            # Install missing package (your error)
            pip install opencv-python

            # Kill old app if running
            pkill -f app.py || true

            # Run app
            nohup python3 instance/app.py > output.log 2>&1 &
